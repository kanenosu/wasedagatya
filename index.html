<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>早稲田ガチャ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 1カラムの学生生活アプリ。上に学生証型HUD、中央にイベントカード、下に年表。臙脂は要所だけ。 */
:root{
  --bg:#F5F1F1; --surface:#FFFFFF; --ink:#1E1517; --muted:#6C5F62; --line:#E3D8D9;
  --enji:#8C1D32; --enji-ink:#FFFFFF; --enji-soft:#F3E3E6;
  --gold:#9A7420; --good:#2B7A4B; --bad:#B3261E; --track:#ECE4E5;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151011; --surface:#211A1C; --ink:#F1E9EA; --muted:#A9999C; --line:#3A2F31;
  --enji:#C9475F; --enji-ink:#FFFFFF; --enji-soft:#3A1F25;
  --gold:#D8B35C; --good:#6CC28E; --bad:#F07B70; --track:#2E2426; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151011; --surface:#211A1C; --ink:#F1E9EA; --muted:#A9999C; --line:#3A2F31;
  --enji:#C9475F; --enji-ink:#FFFFFF; --enji-soft:#3A1F25;
  --gold:#D8B35C; --good:#6CC28E; --bad:#F07B70; --track:#2E2426; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--enji);margin:0}
.lap{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.lap b{color:var(--ink);font-weight:600}
h1,h2,h3{text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--enji);outline-offset:2px}
.btn{background:var(--enji);color:var(--enji-ink);border:0;border-radius:6px;padding:14px 22px;font-weight:700;font-size:16px;letter-spacing:.05em}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--enji);border:1.5px solid var(--enji)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* hero */
.hero{padding-block:28px 6px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--enji);font-weight:700}
.hero h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,46px);line-height:1.25;margin:0}
.hero h2 em{font-style:normal;color:var(--enji)}
.hero p{margin:0;max-width:34em}
.hero .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.howto b{display:block;font-size:13px;color:var(--enji)}
.howto span{font-size:13px;color:var(--muted)}

/* 学生証 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.id-band{background:var(--enji);color:var(--enji-ink);padding:8px 16px;display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.12em;font-weight:700}
.id-body{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.slot{min-width:0}
.slot small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.slot strong{display:block;font-family:var(--f-display);font-size:19px;line-height:1.35}
.slot .tag{font-size:12px;color:var(--muted)}
.slot.spin strong{color:var(--muted)}
.slot.hit strong{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.15);color:var(--enji)}100%{transform:none}}

/* HUD */
.hud{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.term-track{display:flex;gap:4px}
.term-track i{flex:1;height:6px;border-radius:3px;background:var(--track)}
.term-track i.done{background:var(--enji)}
.term-track i.now{background:var(--enji);opacity:.45}
.term-track i.extra{background:var(--bad);opacity:.5}
.hud-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hud-head .term{font-family:var(--f-display);font-weight:700;font-size:18px}
.hud-head .who{font-size:13px;color:var(--muted)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px}
.meter{display:grid;grid-template-columns:4.6em 1fr 2.2em;align-items:center;gap:8px;font-size:12px}
.meter .bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.meter .bar span{display:block;height:100%;background:var(--ink);opacity:.75;transition:width .4s}
.meter.low .bar span{background:var(--bad);opacity:1}
.meter .v{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.facts b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.facts .neg{color:var(--bad)}

/* イベント */
.event{padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.event .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--enji);font-weight:700}
.event h3{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.35}
.event p{margin:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.choice:hover{border-color:var(--enji)}
.choice .l{display:flex;flex-direction:column;min-width:0}
.choice .l small{color:var(--muted);font-size:12px}
.choice .pct{font-family:var(--f-mono);font-size:13px;color:var(--enji);white-space:nowrap}
.result{border-left:3px solid var(--enji);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:6px}
.result.ng{border-left-color:var(--bad)}
.roll{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--enji-soft);font-family:var(--f-mono)}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.grades div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 0}
.grades small{display:block;font-size:11px;color:var(--muted)}
.grades b{font-family:var(--f-mono);font-size:18px}
.grades .f b{color:var(--bad)}

/* 年表 */
.log{padding:14px 16px}
.log h4{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.log ol{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
.log li{display:grid;grid-template-columns:4.2em 1fr;gap:8px}
.log li span:first-child{color:var(--muted);font-family:var(--f-mono);font-size:12px}

/* 成績証明書 */
.cert{padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative}
.cert .head{text-align:center;display:flex;flex-direction:column;gap:2px}
.cert .head small{letter-spacing:.3em;color:var(--muted);font-size:11px}
.cert .head h3{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:.2em}
.rank{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:1;color:var(--enji);text-align:center}
.rank.s{color:var(--gold)}
.verdict{text-align:center;display:flex;flex-direction:column;gap:4px}
.verdict strong{font-family:var(--f-display);font-size:24px;line-height:1.35}
.cert table{width:100%;border-collapse:collapse;font-size:14px}
.cert td{border-top:1px solid var(--line);padding:7px 4px;vertical-align:top}
.cert td:first-child{color:var(--muted);width:7.5em;font-size:13px}
.cert td.mono{font-family:var(--f-mono)}
.stamp{position:absolute;right:14px;top:14px;width:64px;height:64px;border:2px solid var(--enji);border-radius:50%;color:var(--enji);
  display:grid;place-items:center;font-family:var(--f-display);font-size:13px;line-height:1.2;text-align:center;transform:rotate(-12deg);opacity:.8}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.share{font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;word-break:break-all;user-select:all}
.hist{padding:12px 16px}
.hist h4{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.hist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.hist li{display:grid;grid-template-columns:3.2em 2em 1fr;gap:8px;align-items:baseline}
.hist .r{font-family:var(--f-display);font-weight:900;color:var(--enji)}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.id-body{grid-template-columns:1fr}.event h3{font-size:21px}}
/* タイムライン */
:root{--gold-soft:#F4EBD6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold-soft:#3A3120}}
:root[data-theme="dark"]{--gold-soft:#3A3120}
.clock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.clock-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.date{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,5.6vw,26px);line-height:1.2;font-variant-numeric:tabular-nums}
.date small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.ctrl{display:flex;gap:4px;align-items:center}
.ctrl button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;font-family:var(--f-mono)}
.ctrl button[aria-pressed="true"]{background:var(--enji);border-color:var(--enji);color:var(--enji-ink)}
.ctrl .play{min-width:4.6em;font-family:var(--f-body);font-weight:700}
.status{font-size:12px;color:var(--muted)}
.status b{color:var(--enji)}
.feed{padding:12px 16px}
.feed h4{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.feed ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:46vh;overflow:auto}
.feed li{display:grid;grid-template-columns:5.6em 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;animation:slide .25s ease-out}
.feed li:first-child{border-top:0}
.feed li .dt{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.feed li .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.feed li.key .tx{font-weight:700}
.feed li.sys .tx{color:var(--muted)}
.feed .mini{display:flex;flex-wrap:wrap;gap:4px}
.feed .mini span{font-family:var(--f-mono);font-size:11px}
.feed .mini .up{color:var(--good)} .feed .mini .down{color:var(--bad)}
@keyframes slide{from{opacity:.2;transform:translateY(-4px)}to{opacity:1;transform:none}}
.rar{display:inline-block;font-family:var(--f-mono);font-weight:600;font-size:11px;padding:1px 7px;border-radius:4px;letter-spacing:.06em;margin-right:6px;background:var(--track);color:var(--muted);vertical-align:1px}
.rar.R{background:var(--enji-soft);color:var(--enji)}
.rar.SR{background:var(--gold-soft);color:var(--gold)}
.rar.SSR{background:var(--gold);color:var(--surface)}
#app{width:100%;min-width:0}
.clock,.panel,#hud,.feed{min-width:0}
.panel:empty{display:none}
.panel .event{border:2px solid var(--enji)}
.prof{font-size:14px}
.pol-wrap{display:flex;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:8px;min-width:0}
.pol-label{font-size:11px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.pol{display:flex;gap:4px;overflow-x:auto;min-width:0;padding-bottom:2px}
.pol button{flex:none;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12px}
.pol button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pol button:disabled{opacity:.4;cursor:not-allowed}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice:disabled:hover{border-color:var(--line)}
.choice .req{color:var(--muted)}
.choice .req.ng{color:var(--bad)}
.choice .pct.lock{color:var(--bad)}
.tt{border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.tt summary{cursor:pointer;color:var(--muted);font-size:12px;letter-spacing:.06em}
.tt-wrap{overflow-x:auto;margin-top:6px}
.tt table,.gtable{width:100%;border-collapse:collapse;font-size:13px}
.tt td,.gtable td,.gtable th{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.gtable th{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.08em;border-top:0}
.tt .pt{color:var(--muted);font-size:12px;white-space:nowrap}
.kind{font-size:10px;padding:0 5px;border-radius:3px;background:var(--enji-soft);color:var(--enji);white-space:nowrap}
.gtable tr{animation:slide .25s ease-out}
.gtable .g{font-family:var(--f-mono);font-weight:600;font-size:16px;width:3em;text-align:center}
.g-Ap{color:var(--gold);animation:pop .5s ease-out}
.g-A{color:var(--good)}
.g-F{color:var(--bad);animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.gsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.gsum div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.gsum small{display:block;font-size:11px;color:var(--muted)}
.gsum b{font-family:var(--f-mono);font-size:18px}
.gsum b span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.gsum{grid-template-columns:repeat(2,1fr)}}
/* 学生証 */
.idwrap{min-width:0}
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(60,20,30,.35)}
.id-top{background:var(--enji);color:var(--enji-ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 14px}
.id-uni{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.12em}
.id-kind{font-size:10px;letter-spacing:.14em;opacity:.9}
.id-main{display:grid;grid-template-columns:1fr 92px;gap:14px;padding:12px 14px 10px;align-items:start}
.id-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.id-name{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.08em}
.id-info dl{display:grid;grid-template-columns:4.4em 1fr;gap:2px 8px;margin:0;font-size:12.5px}
.id-info dt{color:var(--muted);font-size:11px;letter-spacing:.08em;padding-top:1px}
.id-info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.id-photo svg{display:block;width:92px;height:115px;border-radius:3px;border:1px solid var(--line)}
.id-foot{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding:6px 14px}
/* 入学セットアップ */
.setup{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.setup-row{display:flex;flex-direction:column;gap:6px;min-width:0}
.setup label,.setup .lbl{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.nm-row{display:flex;gap:6px;flex-wrap:wrap}
.nm-row input{flex:1 1 10em;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px;letter-spacing:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.kw{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kw b{font-size:14px}
.kw small{font-size:12px;color:var(--muted)}
.kw .kw-m{font-family:var(--f-mono);font-size:11px;color:var(--enji)}
.kw[aria-pressed="true"]{border:2px solid var(--enji);background:var(--enji-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 成績発表（全画面） */
html.noscroll,html.noscroll body{overflow:hidden}
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:ovin .35s ease-out}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.ov-inner{max-width:720px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:12px}
.mw-bar{background:var(--enji);color:var(--enji-ink);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mw-logo{font-weight:700;letter-spacing:.06em;font-size:17px}
.mw-user{font-size:12px;opacity:.9;font-family:var(--f-mono)}
.mw-crumb{font-size:12px;color:var(--muted)}
.mw-title{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,7vw,36px);margin:0;line-height:1.2}
.mw-live{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.mw-live b{font-family:var(--f-mono);color:var(--ink);font-size:16px}
.gtable.big{font-size:15px}
.gtable.big td{padding:9px 6px}
.gtable.big .g{font-size:24px;width:3.2em}
.overlay .gsum b{font-size:22px}
/* イベントのポップアップ（スマホは下からのシート） */
.panel:not(:empty){position:fixed;inset:0;z-index:40;background:rgba(18,8,11,.5);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 24px);animation:ovin .2s ease-out}
.panel .event{width:100%;max-width:560px;max-height:100%;overflow:auto;overscroll-behavior:contain;border:0;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
.panel .event::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 6px}
@keyframes sheet{from{transform:translateY(60px)}to{transform:none}}

/* ---------- 共通処理 ---------- */
let S=null;
function applyD(d){
  const out=[];
  for(const k in d){
    const v=d[k]; if(!v) continue;
    if(k==="kane")S.kane+=v;
    else if(k==="cr")S.cr+=v;
    else{const b=S.s[k];S.s[k]=clamp(b+v,0,100);if(S.s[k]===b)continue}
    out.push([k,v]);
  }
  return out;
}
function chips(list){return `<div class="chips">${list.map(([k,v])=>`<span class="chip ${v>0?"up":"down"}">${LABEL[k]} ${v>0?"+":""}${v}${k==="kane"?"万":""}</span>`).join("")}</div>`}
function log(t){S.log.push({term:S.date?`${S.date.getFullYear()%100}/${S.date.getMonth()+1}`:"入学",t})}
function gpa(){return S.gu?S.gp/S.gu:0}

/* ---------- ガチャ関数 ---------- */
function pickCircle(cats){
  const pool=CIRCLES.filter(c=>cats.includes(c.cat)&&(!c.only||c.only(S.fac))&&(!c.sex||S.sex===c.sex));
  return wpick(pool);
}
function circleGacha(cat){
  const c=pickCircle([cat]);
  if(c.cat==="tai"){
    const p=pc(S.s.tai,c.diff||60),ok=Math.random()<p;
    if(!ok){
      const alt=pickCircle(["tennis","dance","bunka","unei"]);
      joinCircle(alt);
      S._txt=`${c.n}の練習に参加したが、レベルが違いすぎた（入部成功率 ${Math.round(p*100)}%）。流れで${alt.n}に入った。${alt.t?alt.t+"。":""}`;
      applyD({men:-5});return;
    }
    joinCircle(c);S._txt=`${c.n}に入部した（入部成功率 ${Math.round(p*100)}%）。${c.t}。朝練の生活が始まる。`;return;
  }
  joinCircle(c);
  S._txt=`サークルガチャの結果、${c.n}に入った。${c.t?c.t+"。":""}`;
  S._hd=null;
}

function creditTarget(T){if(T<4)return 22;if(T<6)return 20;if(T<8)return 12;return Math.min(24,Math.max(4,Math.ceil((NEED-S.cr+6)/2)*2))}
function buildTT(T){
  const list=[],slots=new Set();
  const slot=lab=>{let s;do{s=pick(DAYS)+(lab?pick([3,4]):ri(1,5))}while(slots.has(s));slots.add(s);return s};
  const add=(n,c,kind,x)=>{if(list.some(o=>o.n===n)||S.passed.includes(n))return;list.push({n,c,kind,lab:x==="lab",lang:x==="lang",prof:wpick(PROFS),slot:slot(x==="lab")})};
  for(const r of S.retake.filter(r=>r.sem===T%2))add(r.n,r.c,"再履修",r.x);
  S.retake=S.retake.filter(r=>r.sem!==T%2);
  const req=FAC_REQ[S.fac.s]||[];
  if(T<=1){const h=Math.ceil(req.length/2);(T===0?req.slice(0,h):req.slice(h)).forEach(([n,c,x])=>add(n,c,"必修",x))}
  if(T<=3)add(`${S.lang.n}（${T<2?"初級":"中級"}）${T%2?"Ⅱ":"Ⅰ"}`,2,"必修","lang");
  if(T===S.teT)add("Tutorial English",1,"必修");
  if(T>=3&&S.zemi&&S.zemi!=="なし")add(`専門演習（${S.zemi}）`,2,"必修");
  if(T>=5&&S.fac.sci)add("研究室ゼミ",2,"必修");
  const pool=[];
  for(const sfx of SUFFIX)for(const b of [...(FAC_EL[S.fac.s]||[]),...OPEN])pool.push(b+sfx);
  const target=creditTarget(T);
  let guard=0;
  while(list.reduce((a,o)=>a+o.c,0)<target&&guard++<80){
    const cand=pool.filter(n=>!S.passed.includes(n)&&!list.some(o=>o.n===n)&&!S.failedEl.includes(n));
    if(!cand.length){add(`自由選択科目（${S.fac.s}）${++S.freeN}`,2,"選択");continue}
    const base=cand.filter(c=>!SUFFIX.slice(1).some(x=>c.endsWith(x)));
    const n=pick(base.length?base:cand);
    add(n,2,OPEN.some(o=>n.startsWith(o))?"全学":"選択");
  }
  list.sort((a,b)=>DAYS.indexOf(a.slot[0])-DAYS.indexOf(b.slot[0])||a.slot[1]-b.slot[1]);
  return list;
}
function courseScore(co,b){
  const p=co.prof;
  const pm=p.m==="jin"?Math.round((S.s.jin-40)*.3):p.m==="att"?(S.mod<0?-12:3):p.m;
  let sc=41+S.s.gaku*.32-S.ay*1.5+b+S.mod+pm+(S.fac.easy||0)+pol().ex+rnd(-18,22)-(S.s.men<25?10:0)-(S.s.tai<20?8:0);
  if(co.lang)sc+=S.lang.m;
  if(co.lab)sc+=(S.s.tai-50)*.2;
  if(co.kind!=="選択"&&co.kind!=="全学")sc-=2;
  return Math.round(clamp(sc,0,100));
}

function sitExam(ch){
  const b=ch.bonus(S);
  if(ch.cheat&&Math.random()<.2){
    S.pending={T:S.T,rows:S.tt.map(co=>({...co,g:"F"})),void:"試験中の不正行為により、この学期に登録した全科目が無効になった。"};S.mod=0;
    const ds=applyD(ch.d);S._afterExam=()=>suspend(SUSP_MONTHS(),"定期試験での不正行為");

  const avg=rows.reduce((a,r)=>a+GP[r.g],0)/Math.max(1,rows.length);

function job(s,mode){
  const f=s.flags;
  let x=s.s.gk*.35+s.s.jin*.15+s.s.gaku*.15+s.s.men*.1+gpa()*4+s.fac.job+(f.intern||0)*5+(f.ob?4:0)+(f.spi?3:0)+(f.early?5:0)+(f.hakone?10:0)+(s.post?4:0)-(f.late?6:0)+(s.zemi==="人気ゼミ"?4:0)-(f.teigaku||0)*8+(f.giin?4:0)+Math.min(8,(s.kai||0)*.4)+(s.kaiwai?s.kaiwai.job:0);
  let tier,t;
  if(mode==="all"){const r=x+rnd(-20,20);tier=tierOf(r);if(tier==="B")tier="C";
    t=tier==="S"?pick(["第一志望の総合商社から内定の電話が来た。手が震えた。","外資コンサルから内定。初任給の数字を二度見した。","外銀の内定が出た。体力が持つかは知らない。"]):tier==="A"?"第一志望は落ちたが、滑り止めの大手から内定。":tier==="C"?"上位は全滅。持ち駒が尽きて、夏採用の中堅に決めた。":"全滅した。秋採用か、就職浪人か。";}
  else if(mode==="safe"){const r=x+rnd(-8,8)+4;tier=tierOf(r);if(tier==="S")tier="A";
    t=tier==="A"?"手堅く大手から内定をもらった。":tier==="B"?"大手ITから内定。安定した道だ。":tier==="C"?"中堅企業に決まった。":"手堅くいったはずが、まさかの全滅。";}
  else if(mode==="venture"){const ok=Math.random()<clamp((s.s.gk-25)/60,.08,.92);tier=ok?"V":(x>=44?"C":"D");
    t=ok?"成長中のスタートアップに内定。初年度から裁量がある。":tier==="C"?"ベンチャーは全滅。慌てて中堅企業を受けて決めた。":"ベンチャーは全滅。動き出しが遅すぎた。";}
  else if(mode==="startup"){const ok=Math.random()<clamp((s.s.gk+s.s.men-60)/100,.15,.8);tier=ok?"K":tierOf(x-4);
    t=ok?"資金調達に成功した。社長として卒業する。":"資金が尽きて会社を畳んだ。慌てて就活に戻った。";}
  else if(mode==="geinin"){const ok=Math.random()<clamp(.2+(s.flags.ukeru||0)*.15+(s.s.men-50)/200,.1,.7);tier=ok?"M":tierOf(x-8);
    t=ok?"養成所を経ずに事務所に拾われた。LUDOの先輩たちと同じ道だ。":"オーディションに全部落ちた。ネタ帳を閉じて就活した。";}
  else{const ok=Math.random()<pc(s.s.gaku,48);tier=ok?"G":tierOf(x-6);
    t=ok?"院試に合格。あと2年、研究を続ける。":"院試に落ちた。慌てて就活に戻った。";}
  s.job={tier,label:TIERS[tier]}; s._txt=t; log(`進路：${TIERS[tier]}`);
}

/* ---------- 年齢 ---------- */
function age(){const d=S.date,y=d.getFullYear()-S.by,m=d.getMonth()+1;return (m<S.bd.m||(m===S.bd.m&&d.getDate()<S.bd.d))?y-1:y}
const adult=()=>age()>=20;

/* ---------- 停学 ---------- */
const SUSP_MONTHS=()=>S.fac.sci?3:S.fac.s==="教育"?1:S.fac.sils?6:2;
function suspend(months,reason){
  S.flags.teigaku=(S.flags.teigaku||0)+1;
  S.susp=months*30;S.mod-=15;
  applyD({men:-12,jin:-5});
  log(`停学${months}か月（${reason}）`);
  feed(`学部から停学${months}か月の処分が出た。理由は${reason}。`,null,"key");
  if(S.flags.shou){S.flags.shou=0;feed("給付型奨学金の受給資格を失った。",applyD({kane:-10}),"key")}
  if(S.flags.teigaku>=2)S.ending={type:"taigaku"};
}

/* ---------- 20歳未満の飲酒 ---------- */
function underageDrink(s){
  s.flags.udrink=(s.flags.udrink||0)+1;
  const r=Math.random();
  if(r<.12){
    applyD({tai:-20,kane:-3,men:-6});
    if(Math.random()<.5){s._txt="急性アルコール中毒で救急搬送された。病院から大学に連絡が入り、20歳未満の飲酒が発覚した。";s._after=()=>{suspend(1,"20歳未満の飲酒");if(s.circle)feed(`${s.circle.n}は飲酒事故で活動停止になった。`,applyD({jin:-6}),"key")}}
    else s._txt="急性アルコール中毒で救急搬送された。命に別状はなかったが、二度とやらないと誓った。";
  }else if(r<.2){
    s.flags.warn=(s.flags.warn||0)+1;applyD({men:-6});
    s._txt="店に通報が入り、学生部から呼び出された。厳重注意で済んだが、次はない。";
  }else{applyD({jin:3});s._txt="誰にも何も言われなかった。でも20歳未満の飲酒は法律違反だ。";}
}

const ALLF=[...FLOW,...LIFE_FLOW];
const SCHED={
 0:[["nyugaku",4,1],["shinkan",4,4],["rishu",4,9],["hyakuhai",5,23],["natsu",8,3]],
 1:[["wasedasai",11,1],["circleMain",12,12],["kamen",1,17]],
 2:[["zemiPrep",4,6],["sils",9,25]],
 3:[["circleMain",10,18],["zemi",11,12],["kanbu",12,5]],
 4:[["summerIntern",6,10]],
 5:[["circleMain",10,18],["akifuyu",12,3]],
 6:[["honsenko",6,1]],
 7:[["sotsuron",12,8]],
 8:[["ryunen",4,6]],
 9:[],
};
const BASE_Y=2026;
const WD="日月火水木金土";
function termOf(ay,m){return ay*2+(m>=4&&m<=9?0:1)}
function dateIn(T,m,d){const ay=Math.floor(T/2);return new Date(BASE_Y+ay+(m<=3?1:0),m-1,d)}
function dkey(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`}

function planTerm(T){
  const items=[];
  for(const [id,m,d] of SCHED[T]||[])items.push({k:dkey(dateIn(T,m,d)),ev:EV[id]});
  const even=T%2===0;
  const cand=POOL.filter(e=>T>=e.terms[0]&&T<=e.terms[1]);
  const n=T>=6?2:3;
  const used=new Set();
  for(let i=0;i<n&&cand.length;i++){
    const e=wpick(cand);cand.splice(cand.indexOf(e),1);
    let dt;do{dt=even?dateIn(T,ri(4,7),ri(1,28)):dateIn(T,pick([10,11,12,1]),ri(1,28))}while(used.has(dkey(dt))||(even&&dt.getMonth()+1===4&&dt.getDate()<12)||(!even&&dt.getMonth()+1===1&&dt.getDate()>20));
    used.add(dkey(dt));items.push({k:dkey(dt),ev:e});
  }
  items.push({k:dkey(even?dateIn(T,7,24):dateIn(T,1,24)),ev:"exam"});
  items.push({k:dkey(even?dateIn(T,9,1):dateIn(T,3,2)),ev:"grades"});
  S.sched.push(...items);S.sched.sort((a,b)=>a.k-b.k);
}

/* ---------- 進行（自動再生） ---------- */
const SPEEDS=[{n:"×1",ms:140},{n:"×2",ms:70},{n:"×4",ms:30},{n:"×8",ms:10}];
let timer=null;
function newRun(){
  stop();
  meta.runs++; save(meta);
  const fac=wpick(FACS),route=wpick(ROUTES),home=wpick(HOMES),wealth=wpick(WEALTH),lang=wpick(LANGS),past=wpick(PASTS);
  const area=wpick(fac.tokoro&&home.n==="上京して一人暮らし"?[{n:"所沢",w:1,c:3,m:{tai:2},t:"キャンパスには近い"}]:home.areas);
  const s={gaku:ri(38,58),jin:ri(35,55),tai:ri(40,60),men:ri(45,65),gk:ri(10,25)};
  for(const m of [fac.m,route.m,home.m,area.m||{},past.m])for(const k in m)s[k]=clamp(s[k]+m[k],0,100);
  const BD={m:ri(1,12),d:ri(1,28)},RONIN=route.n==="一般選抜"&&Math.random()<.3?1:0,BY=BASE_Y-18-RONIN-(BD.m>=4&&!(BD.m===4&&BD.d===1)?1:0);
  S={n:meta.runs,fac,route,home,area,wealth,lang,past,s,kane:wealth.kane+ri(0,10),cr:0,gp:0,gu:0,ay:0,T:0,mod:0,flags:{},circle:null,circle2:null,post:null,zemi:null,job:null,ending:null,log:[],feed:[],sched:[],today:[],prof:PROFS[4],date:new Date(BASE_Y,2,31),busy:false,recent:[],
    name:pick(SEI)+" "+pick(MEI),sid:`1${"ABCDEFGHJKLMN"[FACS.indexOf(fac)]}${String(BASE_Y%100)}${ri(1000,9999)}-${ri(0,9)}`,face:newFace(),kaiwai:null,sex:"x",kai:0,susp:0,bd:BD,by:BY,ronin:RONIN,passed:[],retake:[],failedEl:[],freeN:0,tt:[],pending:null,pol:"bal",crisis:{},skip:0,teT:ri(0,1),grades:[]};
  renderGacha();
}
function startLife(){
  log(`${S.fac.n}に${S.route.n}で入学${S.ronin?"（1浪）":""}`);
  renderLife();
  play();
}
function play(){S.userPaused=false;run()}
function run(){
  stop();
  if(S.busy||S.ending||S.userPaused)return syncCtrl();
  timer=setInterval(tick,SPEEDS[meta.speed??1].ms);
  syncCtrl();
}
function stop(){if(timer){clearInterval(timer);timer=null}}
function pause(){S.userPaused=true;stop();syncCtrl()}

function tick(){
  if(S.busy||S.ending)return stop();
  if(S.today.length)return fire(S.today.shift());
  const d=S.date=new Date(S.date.getFullYear(),S.date.getMonth(),S.date.getDate()+1);
  const m=d.getMonth()+1,day=d.getDate();
  if(m===4&&day===1&&S.started){S.ay++}
  S.started=1;
  S.T=termOf(S.ay,m);
  if(day===1){
    if(m===4||m===10){
      if(S.T===8||S.T===9){if(!S.job||S.job.tier==="D"){job(S,"safe");feed(`就活をやり直した。${S._txt}`,null,"key")}}
      if(S.T===8&&m===4)S.prof=wpick(PROFS);
      planTerm(S.T);
      S.tt=buildTT(S.T);
      const cr=S.tt.reduce((a,o)=>a+o.c,0),re=S.tt.filter(o=>o.kind==="再履修").length;
      feed(`${TERMS[S.T]}の履修登録。${S.tt.length}科目${cr}単位${re?`（うち再履修${re}科目）`:""}。`,null,"sys");
    }
    const p=pol();
    if(!reqOK(p.req)){S.pol="bal";feed(`方針「${p.n}」を続けられなくなった。バランスに戻した。`,null,"sys")}
    const P=pol();
    const inc=(S.wealth.inc+S.home.cost+(S.area.c||0)+(S.flags.job?14:0))/6+P.kane+(kw().kane||0)-(S.flags.ribo?2:0)-(S.flags.smoke?1.5:0);
    S.kane=Math.round((S.kane+inc)*10)/10;
    const md={...P.d};for(const k in kw().d)md[k]=(md[k]||0)+kw().d[k];if(S.flags.smoke)md.tai=(md.tai||0)-1;
    const ds=applyD(md);
    feed(`${m}月の収支 ${inc>=0?"+":""}${inc.toFixed(1)}万円${P.id!=="bal"?`（方針：${P.n}）`:""}${S.flags.ribo?"。リボの返済が重い":""}`,ds,"sys");
    refreshHud();
  }
  if(m===3&&day===20&&(S.ay===3||S.ay===4)){graduationCheck();if(S.ending)return}
  updateClock();
  if(m===S.bd.m&&day===S.bd.d&&age()===20)S.today.push(EV20);
  const k=dkey(d);
  while(S.sched.length&&S.sched[0].k<=k){const it=S.sched.shift();if(it.k===k)S.today.push(it.ev)}
  if(S.today.length)return fire(S.today.shift());
  if(crisis())return fire(S.today.shift());
  if(S.susp>0){S.susp--;if(S.susp===0){feed("停学が明けた。",null,"sys");refreshHud()}return}
  if(S.skip>0){S.skip--;if(S.skip===0)feed("退院した。",null,"sys");return}
  if(Math.random()<.012)return rare();
  if(Math.random()<.12)flow();
  if(S.s.men<=0){S.ending={type:"kyugaku"};stop();return renderEnd()}
}
function graduationCheck(){
  if(S.cr>=NEED){S.ending={type:"grad"};stop();renderEnd();return}
  if(S.ay===4){S.ending={type:"stuck"};stop();renderEnd();return}
  log(`単位が${NEED-S.cr}足りず留年`);feed(`卒業判定。単位が${NEED-S.cr}足りない。留年が決まった。`,null,"key");
  if(S.job&&!["D","G","K","M"].includes(S.job.tier)&&Math.random()<.5){log("内定取り消し");feed("内定先から連絡。内定は取り消しになった。",applyD({men:-10}),"key");S.job={tier:"D",label:TIERS.D}}
}
function flow(){
  const m=S.date.getMonth()+1;
  const cand=ALLF.filter((f,i)=>(!f.m||f.m.includes(m))&&(!f.y||(S.ay>=f.y[0]&&S.ay<=f.y[1]))&&(!f.c||f.c(S))&&!S.recent.includes(i));
  if(!cand.length)return;
  const f=wpick(cand),i=ALLF.indexOf(f);
  S.recent.push(i);if(S.recent.length>14)S.recent.shift();
  const t=val(f.t);if(f.f)f.f(S);
  feed(t,applyD(val(f.d)||{}));
  refreshHud();
}
function rare(){
  const rar=wpick([{r:"R",w:70},{r:"SR",w:25},{r:"SSR",w:S.kaiwai&&S.kaiwai.id==="kigyo"?12:5}]).r,h=pick(HAPPEN[rar]);
  if(h[2])h[2](S);
  const ds=applyD(h[1]);
  feed(h[0],ds,"key",rar);
  log(`[${rar}] ${h[0].replace(/。.*$/,"")}`);
  refreshHud();
  if(rar!=="R"){S.busy=true;stop();showPanel(`<section class="card event"><span class="eyebrow">${fmtLong(S.date)}</span><h3><span class="rar ${rar}">${rar}</span>ハプニング</h3><p>${esc(h[0])}</p>${ds.length?chips(ds):""}<div class="actions"><button class="btn" id="nx">続ける</button></div></section>`);bindNext()}
}
function fire(ev){
  if(S.susp>0&&ev!=="grades"){
    if(ev==="exam"){S.pending={T:S.T,rows:S.tt.map(co=>({...co,g:"F"})),void:"停学中のため、期末試験を受けられなかった。"};feed("停学中で期末試験を受けられなかった。",null,"key");return}
    if(!Object.values(CRISIS).includes(ev)&&ev!==EV20){feed(`停学中のため「${val(ev.title)}」には関われなかった。`,null,"sys");return}
  }
  if(ev==="exam")return renderExam();
  if(ev==="grades")return S.pending?renderGrades():null;
  if(ev.when&&!ev.when(S))return;
  renderEvent(ev);
}

   </div>
   <div class="setup-row">
    <span class="lbl">性別（昂揚会など、入会条件がある団体の判定にだけ使う）</span>
    <div class="sex-row">${[["m","男性"],["f","女性"],["x","答えない"]].map(([k,l])=>`<button class="kw sx" data-sx="${k}" aria-pressed="${S.sex===k}">${l}</button>`).join("")}</div>
    <p class="muted" style="margin:0;font-size:13px">生年月日は${S.by}年${S.bd.m}月${S.bd.d}日。${S.ronin?"1浪して入学した。":"現役で入学した。"}20歳になるまで酒とタバコは違法だ。</p>
   </div>
   <div class="setup-row" hidden>
    <div class="kw-grid">${KAIWAI.map(k=>`<button class="kw" data-kw="${k.id}" aria-pressed="false"><b>${k.n}</b><small>${k.t}</small><span class="kw-m">${Object.entries(k.m).map(([a,v])=>`${LABEL[a]}${v>0?"+":""}${v}`).join(" ")}</span></button>`).join("")}</div>
   </div>
   <div id="idprev"></div>
  </section>
  <div class="actions"><button class="btn" id="enter" hidden>入学する</button><button class="btn ghost" id="reroll" hidden>引き直す</button></div>`;
  const prev=()=>{$("#idprev").innerHTML=idHTML()};
  let i=0;
  const reveal=()=>{
    if(i>=slots.length){$("#enter").hidden=false;$("#reroll").hidden=false;$("#setup").hidden=false;prev();return}
    const el=$("#sl"+i),st=el.querySelector("strong"),tg=el.querySelector(".tag"),pool=pools[i],x=slots[i];
    let k=0;const iv=setInterval(()=>{st.textContent=pick(pool);if(++k>7){clearInterval(iv);st.textContent=x[1];tg.textContent=x[2];el.classList.remove("spin");el.classList.add("hit");i++;reveal()}},reduce?0:50);
  };
  reveal();
  $("#nm").oninput=e=>{S.name=e.target.value.trim()||"名無し";prev()};
  $("#nmr").onclick=()=>{S.name=pick(SEI)+" "+pick(MEI);$("#nm").value=S.name;prev()};
  $("#fcr").onclick=()=>{S.face=newFace();prev()};
  app.querySelectorAll(".sx").forEach(b=>b.onclick=()=>{S.sex=b.dataset.sx;app.querySelectorAll(".sx").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#enter").onclick=()=>{startLife();scrollTop()};
  $("#reroll").onclick=()=>{meta.runs--;save(meta);newRun()};
}

function renderEvent(e){
  S.busy=true;stop();
  const choices=val(e.choices).filter(c=>!c.when||c.when(S));
  const rq=c=>c.req||REQ[c.label];
  if(!choices.some(c=>reqOK(rq(c))))choices.push({label:"何もできない",sub:"どの選択肢も条件を満たしていない",ok:{t:"見送るしかなかった。",d:{men:-4}}});
  showPanel(`
  <section class="card event">
    <span class="eyebrow">${fmtLong(S.date)}・${TERMS[S.T]}</span>
    <h3>${esc(val(e.title))}</h3>
    <p>${esc(val(e.text))}</p>
    <div class="choices" id="ch">${choices.map((c,i)=>{const r=rq(c),ok=reqOK(r),p=c.chance?c.chance(S):null;
      return `<button class="choice" data-i="${i}" ${ok?"":"disabled"}><span class="l"><span>${esc(c.label)}</span>${c.sub?`<small>${esc(c.sub)}</small>`:""}${r?`<small class="req ${ok?"":"ng"}">条件：${esc(reqTxt(r))}</small>`:""}</span>${!ok?`<span class="pct lock">選べない</span>`:p!=null?`<span class="pct">成功率 ${Math.round(p*100)}%</span>`:""}</button>`}).join("")}</div>
  </section>`);
  $("#panel").querySelectorAll(".choice:not([disabled])").forEach(b=>b.onclick=()=>resolve(e,choices[+b.dataset.i]));
}
function resolve(e,c){
  let ok=true,roll=null,p=c.chance?c.chance(S):null;
  if(p!=null){roll=Math.random();ok=roll<p}
  const r=ok?c.ok:c.ng;
  S._txt=null;S._hd=null;S._rar=null;S._after=null;
  if(r.f)r.f(S);
  const ds=applyD(val(r.d)||{});
  const text=r.t||S._txt||"";
  const ttl=val(e.title);
  if(e!==EV.honsenko)log(`${ttl}：${text.replace(/。.*$/,"")}`);
  feed(`${ttl}：${text}`,ds,"key");
  $("#ch").outerHTML=`<div class="result ${ok?"":"ng"}">
    ${p!=null?`<span class="roll">${esc(c.label)}｜成功率 ${Math.round(p*100)}% → 出目 ${Math.round(roll*100)} … ${ok?"成功":"失敗"}</span>`:`<span class="roll">${esc(c.label)}</span>`}
    <p>${esc(text)}</p>
    ${e===EV.honsenko&&S.job?`<p><strong>進路：${esc(S.job.label)}</strong></p>`:""}
    ${ds.length?chips(ds):""}
  </div>
  <div class="actions"><button class="btn" id="nx">続ける</button></div>`;
  if(S._after){const a=S._after;S._after=null;a()}
  refreshHud();
  bindNext();
}

function renderExam(){
  S.busy=true;stop();
  const name=S.T%2===0?"春学期末試験":"秋学期末試験";
  const cr=S.tt.reduce((a,o)=>a+o.c,0);
  const scary=S.tt.filter(o=>o.prof.m===-10||o.prof.m==="att");
  showPanel(`
  <section class="card event">
    <span class="eyebrow">${fmtLong(S.date)}・${TERMS[S.T]}</span>
    <h3>${name}</h3>
    <p>${S.tt.length}科目${cr}単位分の試験とレポートが一気に来た。${S.mod>0?"これまでの立ち回りが効いていて、今学期は少し有利だ。":S.mod<0?"今学期は欠席が多い。正直ヤバい。":""}</p>
    ${scary.length?`<p class="prof"><span class="rar R">要注意</span>${scary.map(o=>`「${esc(o.n)}」は${esc(o.prof.n)}`).join("、")}。</p>`:`<p class="prof muted">今学期は鬼の教授がいない。チャンスだ。</p>`}
    <div class="choices" id="ch">${EXAM_CH.map((c,i)=>{const ok=reqOK(c.req);return `<button class="choice" data-i="${i}" ${ok?"":"disabled"}><span class="l"><span>${c.label}</span><small>${c.sub}</small>${c.req?`<small class="req ${ok?"":"ng"}">条件：${esc(reqTxt(c.req))}</small>`:""}</span>${ok?"":`<span class="pct lock">選べない</span>`}</button>`}).join("")}</div>
  </section>`);
  $("#panel").querySelectorAll(".choice:not([disabled])").forEach(b=>b.onclick=()=>{
    const c=EXAM_CH[+b.dataset.i],r=sitExam(c);
    if(S._afterExam){const a=S._afterExam;S._afterExam=null;a()}
    feed(`${name}が終わった。${r.feel}成績発表は${S.T%2===0?"9月上旬":"3月上旬"}。`,r.ds,"key");
    $("#ch").outerHTML=`<div class="result">
      <span class="roll">${c.label}</span>
      <p>${r.feel}</p><p class="muted">成績はMyWasedaで${S.T%2===0?"9月上旬":"3月上旬"}に発表される。</p>
      ${r.ds.length?chips(r.ds):""}
    </div><div class="actions"><button class="btn" id="nx">続ける</button></div>`;
    refreshHud();
    bindNext();
  });
}
function renderGrades(){
  S.busy=true;stop();
  const pd=S.pending;S.pending=null;
  const name=pd.T%2===0?"春学期":"秋学期";
  syncCtrl();
  const ov=document.createElement("div");ov.className="overlay";ov.id="ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-label","成績発表");
  ov.innerHTML=`<div class="ov-inner">
    <div class="mw-bar"><span class="mw-logo">MyWaseda</span><span class="mw-user">${esc(S.name)}・${S.sid}</span></div>
    <div class="mw-crumb">成績照会 ＞ ${BASE_Y+Math.floor(pd.T/2)}年度 ${name} ＞ ${S.fac.n}</div>
    <h2 class="mw-title">${TERMS[pd.T]}の成績</h2>
    <p class="muted">${fmtLong(S.date)} 正午。成績が公開された。震える指で成績照会を開く。</p>${pd.void?`<p class="void">${esc(pd.void)}</p>`:""}
    <div class="mw-live"><span id="gprog">0/${pd.rows.length}科目</span><span>集計中のGPA <b id="glive">—</b></span></div>
    <div class="tt-wrap"><table class="gtable big"><thead><tr><th>科目名</th><th>区分</th><th>単位</th><th>評価</th></tr></thead><tbody id="gt"></tbody></table></div>
    <div id="gsum"></div>
  </div>`;
  document.body.append(ov);document.documentElement.classList.add("noscroll");
  const tb=$("#gt");let i=0,gp=0,gu=0,got=0,f=[];
  const step=()=>{
    if(i>=pd.rows.length)return finish();
    const r=pd.rows[i++];
    gu+=r.c;gp+=GP[r.g]*r.c;
    if(r.g!=="F"){got+=r.c;S.passed.push(r.n)}else{f.push(r);if(r.kind==="選択"||r.kind==="全学")S.failedEl.push(r.n);else S.retake.push({n:r.n,c:r.c,sem:pd.T%2,x:r.lab?"lab":r.lang?"lang":""})}
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${esc(r.n)}</td><td><span class="kind">${r.kind}</span></td><td class="mono">${r.c}</td><td class="g g-${r.g==="A+"?"Ap":r.g}">${r.g}</td>`;
    tb.append(tr);
    $("#gprog").textContent=`${i}/${pd.rows.length}科目`;$("#glive").textContent=(gp/gu).toFixed(2);
    try{tr.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"})}catch(e){}
    setTimeout(step,reduce?0:r.g==="F"||r.g==="A+"?520:300);
  };
  const finish=()=>{
    S.gp+=gp;S.gu+=gu;S.cr+=got;
    const tg=gu?gp/gu:0;
    const comment=f.length>=3?"親に見せられない成績表だ。":f.length?`「${f[0].n}」を落とした。${f[0].kind==="必修"||f[0].kind==="再履修"?"必修なので来年また取り直しだ。":""}`:tg>=3.5?"ほぼA+。中央図書館に住んだ甲斐があった。":"フル単。とりあえず安心した。";
    const ds=applyD(f.length>=3?{men:-8}:f.length?{men:-3}:tg>=3.5?{men:6,gaku:2}:{men:3});
    S.grades.push({T:pd.T,gpa:tg,got,f:f.length});
    log(`${TERMS[pd.T]}成績：GPA ${tg.toFixed(2)}、${got}単位取得${f.length?`、${f.length}科目落単`:"、フル単"}`);
    feed(`${TERMS[pd.T]}の成績発表。学期GPA ${tg.toFixed(2)}、${got}単位取得${f.length?`、${f.length}科目落とした`:"、フル単"}。`,ds,"key");
    $("#gsum").innerHTML=`<div class="gsum"><div><small>学期GPA</small><b>${tg.toFixed(2)}</b></div><div><small>取得単位</small><b>${got}<span>/${gu}</span></b></div><div><small>累計GPA</small><b>${gpa().toFixed(2)}</b></div><div><small>累計単位</small><b>${S.cr}<span>/${NEED}</span></b></div></div>
      <p>${esc(comment)}</p>${ds.length?chips(ds):""}<div class="actions"><button class="btn" id="nx">MyWasedaを閉じる</button></div>`;
    refreshHud();
    const b=$("#nx");try{b.scrollIntoView({block:"nearest"})}catch(e){}
    b.onclick=()=>{ov.remove();document.documentElement.classList.remove("noscroll");S.busy=false;if(S.ending)return renderEnd();refreshHud();S.userPaused?syncCtrl():run()};
    b.focus({preventScroll:true});
  };
  setTimeout(step,reduce?0:600);
}

function title(){
  const e=S.ending.type;
  if(e==="kamen")return "早稲田を踏み台にした人";
  if(e==="kyugaku")return "心が先に休学した";
  if(e==="joseki")return "学費が払えなかった人";
  if(e==="taiho")return "闇バイトに手を出した人";
  if(e==="taigaku")return "処分を重ねた人";
  if(e==="kyugakuWork")return "休学して働く人";
  if(e==="stuck")return "早稲田の主";
  if(S.job&&S.job.tier==="M")return "LUDOが生んだ芸人";
  if(S.job&&S.job.tier==="K")return "学生起業家";
  if(S.flags.hakone)return "箱根を走った人";
  if(S.ay>=4)return "5年生のベテラン";
  if(S.post==="代表")return `${S.circle?S.circle.n:"サークル"}の元代表`;
  if(gpa()>=3.4)return "中央図書館の住人";
  const top=STATS.slice().sort((a,b)=>S.s[b[0]]-S.s[a[0]])[0][0];
  return {gaku:"授業の最前列",jin:"高田馬場の顔",tai:"100キロ歩ける体",men:"メンタル最強の早稲田生",gk:"ガクチカ製造機"}[top];
}
function rankOf(){
  const e=S.ending.type;
  if(e==="kamen")return "EX";
  if(["kyugaku","stuck","joseki","kyugakuWork","taiho","taigaku"].includes(e))return "E";
  if(S.job&&(S.job.tier==="M"||S.job.tier==="K"))return "EX";
  const pts={S:5,A:4,B:3,C:2,D:1,V:4,G:4}[S.job?S.job.tier:"D"]+(gpa()>=3.3?.5:0)-(S.ay>=4?1:0);
  return pts>=5?"S":pts>=4?"A":pts>=3?"B":pts>=2?"C":"D";
}
function renderEnd(){
  stop();document.documentElement.classList.remove("noscroll");const ov=$("#ov");if(ov)ov.remove();if($("#panel"))$("#panel").innerHTML="";
  const e=S.ending.type, rank=rankOf(), ttl=title();
  const out=e==="taiho"?"逮捕・退学":e==="taigaku"?"退学":e==="kamen"?"国立大学に再入学":e==="kyugaku"?"休学":e==="joseki"?"除籍":e==="kyugakuWork"?"休学して就労":e==="stuck"?"6年目に突入":(S.job?S.job.label:TIERS.D);
  const head=e==="taiho"?"特殊詐欺の受け子として逮捕された。大学からは退学処分が出た":e==="taigaku"?"2度目の停学処分。学部から退学を勧められ、早稲田を去った":e==="joseki"?"学費を払えず、除籍になった":e==="kyugakuWork"?"借金を返すため、休学して働くことにした":e==="kamen"?"早稲田を去った":e==="kyugaku"?"メンタルが尽きて、休学届を出した":e==="stuck"?"5年でも卒業できなかった":S.ay>=4?"1年遅れて卒業した":"4年で卒業した";
  const firstS=rank==="S"&&!meta.firstS;
  if(firstS)meta.firstS=S.n;
  meta.history.unshift({n:S.n,rank,fac:S.fac.s,out});meta.history=meta.history.slice(0,30);save(meta);
  const share=`【早稲田ガチャ】${S.n}周目：${S.fac.s}・${S.route.n}・${cname(S)}→${out}（${rank}ランク）GPA ${gpa().toFixed(2)}／${S.cr}単位「${ttl}」`;
  app.innerHTML=`
  <section class="idwrap">${idHTML()}</section>
  <section class="card cert">
    <div class="stamp" aria-hidden="true">早稲田<br>${e==="grad"?"卒業":"記録"}</div>
    <div class="head"><small>CERTIFICATE</small><h3>成績証明書</h3><span class="muted mono" style="font-size:12px">${fmtLong(S.date)}・早稲田生活 ${S.n} 周目</span></div>
    <div class="rank ${rank==="S"||rank==="EX"?"s":""}">${rank}</div>
    <div class="verdict"><span class="muted">${head}</span><strong>「${esc(ttl)}」</strong>${firstS?`<span style="color:var(--gold);font-weight:700">${S.n}周目で初めてのSランク</span>`:rank==="S"&&meta.firstS?`<span class="muted">初Sは ${meta.firstS} 周目</span>`:""}</div>
    <table>
      <tr><td>学部</td><td>${S.fac.n}（${S.fac.c}）</td></tr>
      <tr><td>入試方式</td><td>${S.route.n}</td></tr>
      <tr><td>界隈</td><td>${S.circle&&S.circle.kai?`早稲田界隈（顔の広さ ${S.kai}）`:"—"}</td></tr>
      ${S.flags.teigaku||S.flags.warn?`<tr><td>処分歴</td><td>${S.flags.teigaku?`停学${S.flags.teigaku}回 `:""}${S.flags.warn?`厳重注意${S.flags.warn}回`:""}</td></tr>`:""}
      <tr><td>住まい・実家</td><td>${S.home.n==="学生寮"?"学生寮":`${S.home.n}（${S.area.n}）`}／実家は${S.wealth.n}</td></tr>
      <tr><td>第二外国語</td><td>${S.lang.n}</td></tr>
      <tr><td>高校時代</td><td>${S.past.n}</td></tr>
      <tr><td>サークル</td><td>${esc(cname(S))}${S.post?`（${S.post}）`:""}${S.circle2?`、${esc(S.circle2.n)}`:""}</td></tr>
      ${S.zemi?`<tr><td>ゼミ</td><td>${S.zemi}</td></tr>`:""}
      <tr><td>取得単位</td><td class="mono">${S.cr} / ${NEED}</td></tr>
      <tr><td>GPA</td><td class="mono">${S.gu?gpa().toFixed(2):"—"} / 4.00</td></tr>
      <tr><td>所持金</td><td class="mono">${Math.round(S.kane)}万円${S.flags.loan?`（奨学金の返済 ${S.flags.loan}万円）`:""}${S.flags.ribo?"（リボ残高あり）":""}</td></tr>
      ${S.grades.length?`<tr><td>学期ごとのGPA</td><td class="mono" style="font-size:13px">${S.grades.map(g=>`${TERMS[g.T]} ${g.gpa.toFixed(2)}${g.f?`（F${g.f}）`:""}`).join("<br>")}</td></tr>`:""}
      <tr><td>進路</td><td><strong>${esc(out)}</strong></td></tr>
      <tr><td>最終ステータス</td><td class="mono" style="font-size:13px">${STATS.map(([k,l])=>`${l} ${S.s[k]}`).join("　")}</td></tr>
    </table>
  </section>
  <div class="share" id="share">${esc(share)}</div>
  <div class="actions"><button class="btn" id="again">もう一周する</button><button class="btn ghost" id="copy">結果をコピー</button><button class="btn ghost" id="home">トップへ</button></div>
  ${logBox()}`;
  $("#again").onclick=()=>{newRun();scrollTop()};
  $("#home").onclick=()=>{S=null;renderHome();scrollTop()};
  $("#copy").onclick=()=>{
    const b=$("#copy");
    Promise.resolve().then(()=>navigator.clipboard.writeText(share)).then(()=>b.textContent="コピーした").catch(()=>{const r=document.createRange();r.selectNodeContents($("#share"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="選択したのでコピーして"});
  };
  scrollTop();
}

renderHome();
})();
</script>

</body>
