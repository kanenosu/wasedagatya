  <p class="foot">必修科目名は各学部の公開資料にあるもので、選択科目の一部は分野名をもとにしたゲーム用の名前です。成績基準、試験での不正行為の処分（停学と当該学期の全科目無効）、キャンパス内の飲酒禁止と指定喫煙所のルールは大学の公開情報をもとにしています。停学の期間や、2回目の処分で退学になる流れはゲーム用の簡略化です。サークル名や店名、行事は実在のものですが、出来事や性格づけは脚色です。20歳未満の飲酒・喫煙は法律で禁止されています。</p>
